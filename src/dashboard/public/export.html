<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset Ufficiali | Il Cavaliere</title>
  <link rel="icon" href="/logo.svg?v=25" type="image/svg+xml">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/css/styles.css?v=20">
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-6 font-sans text-slate-900 bg-slate-100">
  <div class="max-w-3xl w-full text-center space-y-6 pt-6">
    <div class="space-y-2">
      <div class="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-slate-200 border border-slate-300 text-slate-800 text-xs font-semibold shadow-sm">
        <i data-lucide="shield" class="w-3.5 h-3.5 text-red-600"></i>
        <span>Il Cavaliere • Brand &amp; Media Kit</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold text-slate-900 tracking-tight font-medieval">
        Asset Grafici Ufficiali
      </h1>
      <p class="text-slate-600 text-xs sm:text-sm max-w-lg mx-auto leading-relaxed">
        Scarica il Logo e il Banner in altissima risoluzione PNG per il profilo Discord del bot o per il tuo server.
      </p>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
      <!-- Logo Card -->
      <div class="glass-card p-6 flex flex-col items-center gap-4 text-center">
        <div class="flex items-center gap-2">
          <i data-lucide="image" class="w-4 h-4 text-red-600"></i>
          <h2 class="text-sm font-bold text-slate-900 font-medieval">Avatar Ufficiale (1024x1024)</h2>
        </div>
        <div class="w-40 h-40 rounded-full overflow-hidden border border-slate-300 shadow-sm bg-white p-1">
          <img id="logo-preview" src="/logo.svg?v=25" alt="Logo Preview" class="w-full h-full rounded-full object-cover">
        </div>
        <button onclick="downloadPng('/logo.svg?v=25', 'il-cavaliere-avatar.png', 1024, 1024)" 
                class="btn-knight w-full py-2.5 px-4 text-xs font-bold shadow-sm">
          <i data-lucide="download" class="w-4 h-4"></i>
          <span>Scarica Avatar PNG</span>
        </button>
      </div>

      <!-- Banner Card -->
      <div class="glass-card p-6 flex flex-col items-center gap-4 text-center">
        <div class="flex items-center gap-2">
          <i data-lucide="layout" class="w-4 h-4 text-red-600"></i>
          <h2 class="text-sm font-bold text-slate-900 font-medieval">Banner Ufficiale (1200x480)</h2>
        </div>
        <div class="w-full h-40 rounded-xl overflow-hidden border border-slate-300 shadow-sm flex items-center justify-center bg-slate-50 p-1">
          <img id="banner-preview" src="/banner.svg?v=25" alt="Banner Preview" class="w-full h-full rounded-lg object-contain">
        </div>
        <button onclick="downloadPng('/banner.svg?v=25', 'il-cavaliere-banner.png', 1200, 480)" 
                class="btn-knight w-full py-2.5 px-4 text-xs font-bold shadow-sm">
          <i data-lucide="download" class="w-4 h-4"></i>
          <span>Scarica Banner PNG</span>
        </button>
      </div>
    </div>

    <div class="pt-4">
      <a href="/" class="btn-secondary text-xs py-2 px-4 inline-flex items-center gap-2">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>Torna alla Home</span>
      </a>
    </div>
  </div>

  <canvas id="export-canvas" class="hidden"></canvas>

  <script>
    async function downloadPng(svgUrl, filename, width, height) {
      try {
        const svgRes = await fetch(svgUrl + '?t=' + Date.now());
        const svgText = await svgRes.text();

        const canvas = document.getElementById('export-canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');

        const img = new Image();
        const svgBlob = new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' });
        const url = URL.createObjectURL(svgBlob);

        img.onload = () => {
          ctx.clearRect(0, 0, width, height);
          ctx.drawImage(img, 0, 0, width, height);
          URL.revokeObjectURL(url);

          const pngUrl = canvas.toDataURL('image/png');
          const link = document.createElement('a');
          link.download = filename;
          link.href = pngUrl;
          link.click();
        };
        img.src = url;
      } catch (e) {
        console.error('Error generating PNG:', e);
        alert('Errore durante la generazione del file PNG.');
      }
    }
    if (window.lucide) lucide.createIcons();
  </script>
</body>
</html>
