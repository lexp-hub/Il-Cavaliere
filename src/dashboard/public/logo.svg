<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Ultra-Smooth Feathered Radial Background Gradient -->
    <radialGradient id="logoBackgroundGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3d1403" stop-opacity="0.85" />
      <stop offset="25%" stop-color="#240c02" stop-opacity="0.65" />
      <stop offset="55%" stop-color="#120501" stop-opacity="0.4" />
      <stop offset="80%" stop-color="#050100" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Fiery Golden-Orange Metallic Gradient for the Templar Cross -->
    <linearGradient id="crossGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="20%" stop-color="#fbbf24" />
      <stop offset="60%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Circular Base in Pure AMOLED Black -->
  <rect width="512" height="512" rx="256" fill="#000000" />
  <rect width="512" height="512" rx="256" fill="url(#logoBackgroundGlow)" />
  
  <!-- Unified, Seamless Knights Templar Cross Path (Zero internal seams/squares) -->
  <g transform="translate(256, 256) scale(0.95)" fill="url(#crossGradient)">
    <path d="M -15 -15 
             C -20 -55 -45 -115 -92 -165 
             C -40 -140 40 -140 92 -165 
             C 45 -115 20 -55 15 -15 
             C 55 -20 115 -45 165 -92 
             C 140 -40 140 40 165 92 
             C 115 45 55 20 15 15 
             C 20 55 45 115 92 165 
             C 40 140 -40 140 -92 165 
             C -45 115 -20 55 -15 15 
             C -55 20 -115 45 -165 92 
             C -140 40 -140 -40 -165 -92 
             C -115 -45 -55 -20 -15 -15 Z" />
  </g>
</svg>
