<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Noctaly-Grade Ultra-Clean Atmospheric Amber Glow for Avatar -->
    <radialGradient id="noctalyAvatarAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.38" />
      <stop offset="35%" stop-color="#ea580c" stop-opacity="0.18" />
      <stop offset="65%" stop-color="#7c2d12" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Luxury Metallic Platinum-Gold-Orange Gradient -->
    <linearGradient id="noctalyCrossGradient" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#ffedd5" />
      <stop offset="40%" stop-color="#fb923c" />
      <stop offset="75%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Pure Seamless Knights Templar Cross Path -->
    <g id="templarCrossSingle">
      <path d="M -15 -15 
               C -20 -55 -45 -115 -92 -165 
               C -40 -140 40 -140 92 -165 
               C 45 -115 20 -55 15 -15 
               C 55 -20 115 -45 165 -92 
               C 140 -40 140 40 165 92 
               C 115 45 55 20 15 15 
               C 20 55 45 115 92 165 
               C 40 140 -40 140 -92 165 
               C -45 115 -20 55 -15 15 
               C -55 20 -115 45 -165 92 
               C -140 40 -140 -40 -165 -92 
               C -115 -45 -55 -20 -15 -15 Z" />
    </g>
  </defs>

  <!-- Pure AMOLED Black Circular Base -->
  <rect width="512" height="512" rx="256" fill="#000000" />

  <!-- Soft Minimalist Ambient Glow -->
  <rect width="512" height="512" rx="256" fill="url(#noctalyAvatarAura)" />

  <!-- Subtle Modern Accent Rings -->
  <circle cx="256" cy="256" r="195" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.08" />
  <circle cx="256" cy="256" r="225" fill="none" stroke="#f97316" stroke-width="0.75" stroke-opacity="0.15" stroke-dasharray="6 8" />

  <!-- Center Hero: Iconic Templar Cross with Noctaly Luxury Shading -->
  <g transform="translate(256, 256) scale(0.95)" fill="url(#noctalyCrossGradient)" filter="drop-shadow(0 6px 30px rgba(234, 88, 12, 0.5))">
    <use href="#templarCrossSingle" />
  </g>
</svg>
