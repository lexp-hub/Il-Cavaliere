<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Deep Cinematic Ember Bloom for Circular Avatar -->
    <radialGradient id="avatarRelicBloom" cx="50%" cy="50%" r="55%">
      <stop offset="0%" stop-color="#4a1804" stop-opacity="0.9" />
      <stop offset="25%" stop-color="#2d0e02" stop-opacity="0.7" />
      <stop offset="55%" stop-color="#140501" stop-opacity="0.45" />
      <stop offset="80%" stop-color="#050100" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Fiery Golden-Orange Metallic Gradient for the Relic Cross -->
    <linearGradient id="avatarCrossGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb" />
      <stop offset="15%" stop-color="#fef08a" />
      <stop offset="35%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>

    <!-- Sword Steel-Gold Metallic Gradient -->
    <linearGradient id="avatarSwordBlade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#d97706" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#78350f" stop-opacity="0.2" />
    </linearGradient>

    <!-- Templar Cross Geometry -->
    <g id="avatarTemplarCross">
      <path d="M -15 -15 
               C -20 -55 -45 -115 -92 -165 
               C -40 -140 40 -140 92 -165 
               C 45 -115 20 -55 15 -15 
               C 55 -20 115 -45 165 -92 
               C 140 -40 140 40 165 92 
               C 115 45 55 20 15 15 
               C 20 55 45 115 92 165 
               C 40 140 -40 140 -92 165 
               C -45 115 -20 55 -15 15 
               C -55 20 -115 45 -165 92 
               C -140 40 -140 -40 -165 -92 
               C -115 -45 -55 -20 -15 -15 Z" />
    </g>

    <!-- Medieval Crusader Sword for Avatar -->
    <g id="avatarSword">
      <!-- Blade -->
      <path d="M 0 -220 L 7 -200 L 6 70 L 0 78 L -6 70 L -7 -200 Z" fill="url(#avatarSwordBlade)" />
      <!-- Fuller (Blade Center Groove) -->
      <line x1="0" y1="-200" x2="0" y2="60" stroke="#fef08a" stroke-width="1.2" stroke-opacity="0.75" />
      <!-- Guard (Crossguard) -->
      <path d="M -36 74 Q 0 78 36 74 Q 36 84 32 84 Q 0 82 -32 84 Z" fill="#fbbf24" fill-opacity="0.85" />
      <!-- Grip / Handle -->
      <rect x="-3.5" y="84" width="7" height="38" rx="1.5" fill="#451a03" />
      <line x1="-3.5" y1="92" x2="3.5" y2="92" stroke="#fbbf24" stroke-width="0.8" stroke-opacity="0.6" />
      <line x1="-3.5" y1="102" x2="3.5" y2="102" stroke="#fbbf24" stroke-width="0.8" stroke-opacity="0.6" />
      <line x1="-3.5" y1="112" x2="3.5" y2="112" stroke="#fbbf24" stroke-width="0.8" stroke-opacity="0.6" />
      <!-- Pommel (Ring/Disk Pommel) -->
      <circle cx="0" cy="130" r="9" fill="#fbbf24" fill-opacity="0.9" />
      <circle cx="0" cy="130" r="4" fill="#1c1917" />
    </g>
  </defs>

  <!-- Pure AMOLED Black Circular Base -->
  <rect width="512" height="512" rx="256" fill="#000000" />

  <!-- Center Atmospheric Warm Relic Glow -->
  <rect width="512" height="512" rx="256" fill="url(#avatarRelicBloom)" />

  <!-- Sacred Geometry: Ancient Astrological & Halo Rings in Faint Gold -->
  <g transform="translate(256, 256)">
    <!-- Outer Delicate Orbit Ring -->
    <circle cx="0" cy="0" r="215" fill="none" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.18" stroke-dasharray="8 10" />
    <!-- Secondary Sacred Ring -->
    <circle cx="0" cy="0" r="185" fill="none" stroke="#fbbf24" stroke-width="1.4" stroke-opacity="0.25" />
    <!-- Inner Radiant Ring -->
    <circle cx="0" cy="0" r="150" fill="none" stroke="#f59e0b" stroke-width="0.8" stroke-opacity="0.2" stroke-dasharray="4 8" />

    <!-- 4 Cardinal Ray Ticks -->
    <line x1="0" y1="-225" x2="0" y2="-200" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.4" />
    <line x1="0" y1="200" x2="0" y2="225" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.4" />
    <line x1="-225" y1="0" x2="-200" y2="0" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.4" />
    <line x1="200" y1="0" x2="225" y2="0" stroke="#fbbf24" stroke-width="2" stroke-opacity="0.4" />
    
    <!-- 4 Diagonal Diamond Stars -->
    <g transform="rotate(45)" stroke="#fbbf24" stroke-opacity="0.3" stroke-width="1.2">
      <line x1="0" y1="-215" x2="0" y2="-200" />
      <line x1="0" y1="200" x2="0" y2="215" />
      <line x1="-215" y1="0" x2="-200" y2="0" />
      <line x1="200" y1="0" x2="215" y2="0" />
    </g>

    <!-- Crossed Crusader Broadswords Behind the Cross -->
    <g transform="rotate(-42)">
      <use href="#avatarSword" />
    </g>
    <g transform="rotate(42) scale(-1, 1)">
      <use href="#avatarSword" />
    </g>

    <!-- Floating Atmosphere Embers & Sparks -->
    <circle cx="-130" cy="-90" r="2" fill="#fef08a" opacity="0.6" />
    <circle cx="-110" cy="110" r="1.5" fill="#fb923c" opacity="0.5" />
    <circle cx="120" cy="-100" r="1.8" fill="#fef08a" opacity="0.65" />
    <circle cx="140" cy="80" r="2.2" fill="#f97316" opacity="0.45" />
    <circle cx="-40" cy="-150" r="1.4" fill="#fbbf24" opacity="0.7" />
    <circle cx="50" cy="155" r="1.4" fill="#fbbf24" opacity="0.7" />

    <!-- Centerpiece: The Grand Golden Knights Templar Cross -->
    <g fill="url(#avatarCrossGold)" filter="drop-shadow(0 0 20px rgba(249, 115, 22, 0.45))">
      <g transform="scale(0.95)">
        <use href="#avatarTemplarCross" />
      </g>
    </g>
  </g>
</svg>
