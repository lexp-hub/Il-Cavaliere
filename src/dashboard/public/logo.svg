<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft Orange Ambient Glow on Avatar Base -->
    <radialGradient id="avatarOrangeGlow" cx="25%" cy="25%" r="75%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.4" />
      <stop offset="55%" stop-color="#ea580c" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Exact Knights Templar Beauceant Cross Geometry -->
    <g id="templarCrossSolo">
      <!-- Top Arm -->
      <path d="M -18 -18 C -20 -60 -45 -115 -92 -165 C -40 -140 40 -140 92 -165 C 45 -115 20 -60 18 -18 Z" />
      <!-- Right Arm (Rotated 90) -->
      <path d="M -18 -18 C -20 -60 -45 -115 -92 -165 C -40 -140 40 -140 92 -165 C 45 -115 20 -60 18 -18 Z" transform="rotate(90)" />
      <!-- Bottom Arm (Rotated 180) -->
      <path d="M -18 -18 C -20 -60 -45 -115 -92 -165 C -40 -140 40 -140 92 -165 C 45 -115 20 -60 18 -18 Z" transform="rotate(180)" />
      <!-- Left Arm (Rotated 270) -->
      <path d="M -18 -18 C -20 -60 -45 -115 -92 -165 C -40 -140 40 -140 92 -165 C 45 -115 20 -60 18 -18 Z" transform="rotate(270)" />
      <!-- Central Core Square -->
      <rect x="-18" y="-18" width="36" height="36" />
    </g>
  </defs>

  <!-- Circular Base in Pure AMOLED Black -->
  <rect width="512" height="512" rx="256" fill="#000000" />
  <rect width="512" height="512" rx="256" fill="url(#avatarOrangeGlow)" />
  
  <!-- Main Templar Cross Logo (Pure White, Perfectly Centered, Zero extra crosses) -->
  <g transform="translate(256, 256) scale(0.95)" fill="#ffffff">
    <use href="#templarCrossSolo" />
  </g>
</svg>
