<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Soft, Restrained Noctaly Edge Glow for Avatar -->
    <radialGradient id="logoEdgeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0" />
      <stop offset="68%" stop-color="#000000" stop-opacity="0" />
      <stop offset="85%" stop-color="#ea580c" stop-opacity="0.08" />
      <stop offset="96%" stop-color="#f97316" stop-opacity="0.16" />
      <stop offset="100%" stop-color="#ea580c" stop-opacity="0.22" />
    </radialGradient>

    <!-- Luxury Metallic Platinum-Gold-Orange Gradient -->
    <linearGradient id="noctalyCrossGradient" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="15%" stop-color="#ffedd5" />
      <stop offset="40%" stop-color="#fb923c" />
      <stop offset="75%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <!-- Pure Seamless Knights Templar Cross Path -->
    <g id="templarCrossSingle">
      <path d="M -15 -15 
               C -20 -55 -45 -115 -92 -165 
               C -40 -140 40 -140 92 -165 
               C 45 -115 20 -55 15 -15 
               C 55 -20 115 -45 165 -92 
               C 140 -40 140 40 165 92 
               C 115 45 55 20 15 15 
               C 20 55 45 115 92 165 
               C 40 140 -40 140 -92 165 
               C -45 115 -20 55 -15 15 
               C -55 20 -115 45 -165 92 
               C -140 40 -140 -40 -165 -92 
               C -115 -45 -55 -20 -15 -15 Z" />
    </g>
  </defs>

  <!-- Pure AMOLED Black Circular Base -->
  <rect width="512" height="512" rx="256" fill="#000000" />

  <!-- Soft Restrained Edge Glow Layer -->
  <rect width="512" height="512" rx="256" fill="url(#logoEdgeGlow)" />

  <!-- Ultra-Faint Precision Accent Rings near Border -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#ea580c" stroke-width="0.75" stroke-opacity="0.18" />
  <circle cx="256" cy="256" r="222" fill="none" stroke="#f97316" stroke-width="0.5" stroke-opacity="0.12" stroke-dasharray="4 6" />
  <circle cx="256" cy="256" r="208" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.05" />

  <!-- Center Hero: Iconic Templar Cross (On Pure Black Canvas, Maximum Crisp Contrast) -->
  <g transform="translate(256, 256) scale(0.95)" fill="url(#noctalyCrossGradient)" filter="drop-shadow(0 4px 14px rgba(234, 88, 12, 0.28))">
    <use href="#templarCrossSingle" />
  </g>
</svg>
