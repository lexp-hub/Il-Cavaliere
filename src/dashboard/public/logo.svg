<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Crisp Light Steel / Silver Gradient -->
    <linearGradient id="logoSilverBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Authentic Crimson Knight Gradient -->
    <linearGradient id="crusaderCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Pure Seamless Knights Templar Cross Path -->
    <g id="templarCrossSingle">
      <path d="M -15 -15 
               C -20 -55 -45 -115 -92 -165 
               C -40 -140 40 -140 92 -165 
               C 45 -115 20 -55 15 -15 
               C 55 -20 115 -45 165 -92 
               C 140 -40 140 40 165 92 
               C 115 45 55 20 15 15 
               C 20 55 45 115 92 165 
               C 40 140 -40 140 -92 165 
               C -45 115 -20 55 -15 15 
               C -55 20 -115 45 -165 92 
               C -140 40 -140 -40 -165 -92 
               C -115 -45 -55 -20 -15 -15 Z" />
    </g>
  </defs>

  <!-- Circular Base: Clean Crisp Silver Plate -->
  <circle cx="256" cy="256" r="256" fill="url(#logoSilverBg)" />

  <!-- Subtle Inner Hairline Borders -->
  <circle cx="256" cy="256" r="254" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.8" />
  <circle cx="256" cy="256" r="250" fill="none" stroke="#cbd5e1" stroke-width="1" />
  <circle cx="256" cy="256" r="236" fill="none" stroke="#94a3b8" stroke-width="1" stroke-opacity="0.4" />
  <circle cx="256" cy="256" r="224" fill="none" stroke="#dc2626" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 6" />

  <!-- Center Hero: Templar Cross (Deep Crimson on Crisp Silver Plate) -->
  <g transform="translate(256, 256) scale(0.95)" fill="url(#crusaderCrossGrad)" filter="drop-shadow(0 4px 12px rgba(220, 38, 38, 0.35))">
    <use href="#templarCrossSingle" />
  </g>
</svg>
