<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Minimalist Monochromatic Knight Symbol -->
  <rect width="512" height="512" rx="100" fill="#0c0d12" />
  
  <g fill="#f59e0b" transform="translate(56, 56)">
    <!-- Outer Shield Frame -->
    <path d="M200 10 C290 10 370 30 370 30 C370 190 330 310 200 390 C70 310 30 190 30 30 C30 30 110 10 200 10 Z" 
          fill="none" stroke="#f59e0b" stroke-width="16" stroke-linejoin="round" />
    
    <!-- Knight Helmet Minimalist Silhouette -->
    <!-- Helmet Crown & Plume -->
    <path d="M200 65 C150 65 115 105 110 160 L290 160 C285 105 250 65 200 65 Z" />
    
    <!-- Helmet Plume / Crest -->
    <path d="M190 40 L200 20 L210 40 L200 55 Z" />

    <!-- Helmet Visor / Faceplate -->
