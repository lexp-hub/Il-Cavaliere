    <!-- Vertical Breathing Slits (Negative Space) -->
    <rect x="155" y="235" width="12" height="40" rx="6" fill="#0c0d12" />
    <rect x="180" y="235" width="12" height="55" rx="6" fill="#0c0d12" />
    <rect x="208" y="235" width="12" height="55" rx="6" fill="#0c0d12" />
    <rect x="233" y="235" width="12" height="40" rx="6" fill="#0c0d12" />
  </g>
</svg>
