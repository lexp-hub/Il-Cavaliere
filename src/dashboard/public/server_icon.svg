<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Shadow & Glow Filters -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.75" />
    </filter>
    <filter id="crossGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#7f1d1d" flood-opacity="0.4" />
    </filter>

    <!-- Gradients -->
    <linearGradient id="rubyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4d79" />
      <stop offset="40%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <linearGradient id="darkRuby" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="60%" stop-color="#881337" />
      <stop offset="100%" stop-color="#4c0519" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="30%" stop-color="#fbbf24" />
      <stop offset="70%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#92400e" />
    </linearGradient>

    <linearGradient id="goldQuarter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="45%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <linearGradient id="silverQuarter" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <linearGradient id="darkTitanium" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="frameGold" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="25%" stop-color="#d97706" />
      <stop offset="75%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>

    <!-- Clip Path for Shield Interior (Spacious Lower Section) -->
    <clipPath id="shieldClip">
      <path d="M 256,86 
               C 305,86 355,94 382,106 
               C 392,190 385,280 348,348 
               C 318,390 280,412 256,420 
               C 232,412 194,390 164,348 
               C 127,280 120,190 130,106 
               C 157,94 207,86 256,86 Z" />
    </clipPath>

    <!-- Sentry Official Templar Cross Emblem -->
    <g id="sentryTemplarEmblem">
      <path d="M -15 -15 
               C -20 -55 -45 -115 -92 -165 
               C -40 -140 40 -140 92 -165 
               C 45 -115 20 -55 15 -15 
               C 55 -20 115 -45 165 -92 
               C 140 -40 140 40 165 92 
               C 115 45 55 20 15 15 
               C 20 55 45 115 92 165 
               C 40 140 -40 140 -92 165 
               C -45 115 -20 55 -15 15 
               C -55 20 -115 45 -165 92 
               C -140 40 -140 -40 -165 -92 
               C -115 -45 -55 -20 -15 -15 Z" 
            fill="url(#darkRuby)" stroke="#7f1d1d" stroke-width="4" />
      <path d="M -12 -12 
               C -17 -48 -40 -102 -82 -148 
               C -35 -125 35 -125 82 -148 
               C 40 -102 17 -48 12 -12 
               C 48 -17 102 -40 148 -82 
               C 125 -35 125 35 148 82 
               C 102 40 48 17 12 12 
               C 17 48 40 102 82 148 
               C 35 125 -35 125 -82 148 
               C -40 102 -17 48 -12 12 
               C -48 17 -102 40 -148 82 
               C -125 35 -125 -35 -148 -82 
               C -102 -40 -48 -17 -12 -12 Z" 
            fill="url(#rubyGrad)" />
    </g>
  </defs>

