          fill="#0c121e" />
  </g>

  <!-- 4. Quatered Shield Field (Inquartato Araldico Spazioso) -->
  <g clip-path="url(#shieldClip)">
    <!-- Top-Left (Q1): Pearl Silver Field -->
    <rect x="120" y="70" width="136" height="155" fill="url(#silverQuarter)" />

    <!-- Top-Right (Q2): Imperial Gold Field -->
    <rect x="256" y="70" width="145" height="155" fill="url(#goldQuarter)" />

    <!-- Bottom-Left (Q3): Imperial Gold Field -->
    <rect x="120" y="225" width="136" height="205" fill="url(#goldQuarter)" />

    <!-- Bottom-Right (Q4): Pearl Silver Field -->
    <rect x="256" y="225" width="145" height="205" fill="url(#silverQuarter)" />

    <!-- ================= EMBLEMS IN 4 QUARTERS ================= -->

    <!-- Q1 (Top-Left): SENTRY OFFICIAL LOGO EMBLEM (Templar Cross) -->
    <g transform="translate(196, 155) scale(0.28)" filter="url(#crossGlow)">
      <use href="#sentryTemplarEmblem" />
    </g>

    <!-- Q2 (Top-Right): Red Heraldic Castle Tower on Gold -->
    <g transform="translate(318, 155) scale(0.66)" filter="url(#dropShadow)">
      <!-- Tower Base & Walls -->
      <path d="M -24,36 L 24,36 L 20,-15 L 26,-15 L 26,-36 L 16,-36 L 16,-24 L 8,-24 L 8,-36 L -8,-36 L -8,-24 L -16,-24 L -16,-36 L -26,-36 L -26,-15 L -20,-15 Z" 
