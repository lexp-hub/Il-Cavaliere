      <rect x="-2" y="-5" width="4" height="10" rx="1.5" fill="#450a0a" />
    </g>

    <!-- Q4 (Bottom-Right): SENTRY OFFICIAL LOGO EMBLEM (Posizionato comodamente nel quadrante) -->
    <g transform="translate(314, 298) scale(0.28)" filter="url(#crossGlow)">
      <use href="#sentryTemplarEmblem" />
    </g>

    <!-- Center Dividing Filigree Cross (Vertical & Horizontal Divider) -->
    <!-- Vertical Divider Line -->
    <rect x="253" y="70" width="6" height="350" fill="#1e293b" />
    <rect x="254.5" y="70" width="3" height="350" fill="url(#goldGrad)" />
    
    <!-- Horizontal Divider Line -->
    <rect x="120" y="222" width="270" height="6" fill="#1e293b" />
    <rect x="120" y="223.5" width="270" height="3" fill="url(#goldGrad)" />

    <!-- Center Boss / Rosette Emblem -->
    <circle cx="256" cy="225" r="11" fill="#1e293b" stroke="#0f172a" stroke-width="1.5" />
    <circle cx="256" cy="225" r="8" fill="url(#goldGrad)" />
    <circle cx="256" cy="225" r="4" fill="#ef4444" />

    <!-- Diagonal Glass Specular Highlight Overlay -->
    <path d="M 130,106 L 382,106 L 256,260 L 130,260 Z" fill="url(#silverQuarter)" opacity="0.10" />
  </g>

