      <rect x="-2" y="-5" width="4" height="10" rx="1.5" fill="#450a0a" />
    </g>

    <!-- Q3 (Bottom-Left): Red Heraldic Castle Tower (Posizionata comodamente nel quadrante) -->
    <g transform="translate(198, 298) scale(0.60)" filter="url(#dropShadow)">
      <path d="M -24,36 L 24,36 L 20,-15 L 26,-15 L 26,-36 L 16,-36 L 16,-24 L 8,-24 L 8,-36 L -8,-36 L -8,-24 L -16,-24 L -16,-36 L -26,-36 L -26,-15 L -20,-15 Z" 
