  <!-- 3. Heavy Shield Outer Frame / Bevel (Titanium & Gold Border) -->
  <g filter="url(#dropShadow)">
    <!-- Outer Dark Titanium Shield Body -->
    <path d="M 256,72 
             C 310,72 365,80 396,94 
             C 408,190 400,285 362,358 
             C 328,404 285,428 256,438 
             C 227,428 184,404 150,358 
             C 112,285 104,190 116,94 
             C 147,80 202,72 256,72 Z" 
          fill="url(#darkTitanium)" stroke="#0f172a" stroke-width="4" />

    <!-- Gold Inlaid Border -->
    <path d="M 256,79 
             C 306,79 358,87 388,100 
             C 399,188 391,280 355,350 
             C 322,395 281,418 256,427 
             C 231,418 190,395 157,350 
             C 121,280 113,188 124,100 
             C 154,87 206,79 256,79 Z" 
          fill="url(#frameGold)" />

