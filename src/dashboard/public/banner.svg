<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <!-- Import Metamorphous Font directly inside SVG -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Metamorphous&amp;display=swap');
      .banner-title {
        font-family: 'Metamorphous', 'Cinzel', 'Cinzel Decorative', serif;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .banner-sub {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 700;
        letter-spacing: 3.5px;
      }
      .banner-tags {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-weight: 600;
        letter-spacing: 1.5px;
      }
    </style>

    <!-- Ultra-Subtle, Soft Noctaly Edge Vignette Glows -->
    <radialGradient id="edgeGlowTopLeft" cx="0%" cy="0%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.14" />
      <stop offset="45%" stop-color="#ea580c" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="edgeGlowBottomRight" cx="100%" cy="100%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.12" />
      <stop offset="45%" stop-color="#ea580c" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Luxury Metallic Platinum-Gold-Orange Gradient for Cross & Text -->
    <linearGradient id="crossMetallicGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="20%" stop-color="#ffedd5" />
      <stop offset="45%" stop-color="#fb923c" />
      <stop offset="80%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#c2410c" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <!-- Subtle Noctaly Tech Grid -->
    <pattern id="noctalyGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.02" />
    </pattern>

    <!-- Pure Seamless Knights Templar Cross Path -->
    <g id="templarCrossSingle">
      <path d="M -15 -15 
               C -20 -55 -45 -115 -92 -165 
               C -40 -140 40 -140 92 -165 
               C 45 -115 20 -55 15 -15 
               C 55 -20 115 -45 165 -92 
               C 140 -40 140 40 165 92 
               C 115 45 55 20 15 15 
               C 20 55 45 115 92 165 
               C 40 140 -40 140 -92 165 
               C -45 115 -20 55 -15 15 
               C -55 20 -115 45 -165 92 
               C -140 40 -140 -40 -165 -92 
               C -115 -45 -55 -20 -15 -15 Z" />
    </g>
  </defs>

  <!-- Pure AMOLED Black Canvas Base -->
  <rect width="600" height="240" fill="#000000" />

  <!-- Ultra-Subtle Noctaly Tech Grid -->
  <rect width="600" height="240" fill="url(#noctalyGrid)" />

  <!-- Delicate, Soft Edge & Corner Lighting -->
  <rect width="600" height="240" fill="url(#edgeGlowTopLeft)" />
  <rect width="600" height="240" fill="url(#edgeGlowBottomRight)" />

  <!-- Ultra-Faint Border Accent -->
  <rect width="598" height="238" x="1" y="1" rx="4" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.04" />

  <!-- Left: Glowing Templar Cross Emblem -->
  <g transform="translate(130, 120)">
    <!-- Delicate Modern Accent Rings -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.06" />
    <circle cx="0" cy="0" r="92" fill="none" stroke="#f97316" stroke-width="0.5" stroke-opacity="0.1" stroke-dasharray="4 6" />
    
    <!-- Hero Cross with Balanced Soft Aura -->
    <g transform="scale(0.46)" fill="url(#crossMetallicGrad)" filter="drop-shadow(0 4px 16px rgba(234, 88, 12, 0.3))">
      <use href="#templarCrossSingle" />
    </g>
  </g>

  <!-- Right: Luxury Typography & Subtitle -->
  <g transform="translate(250, 120)">
    <!-- Version Tag Pill -->
    <g transform="translate(0, -65)">
      <rect x="0" y="0" width="62" height="18" rx="9" fill="rgba(249, 115, 22, 0.1)" stroke="rgba(249, 115, 22, 0.3)" stroke-width="0.5" />
      <text x="31" y="12.5" fill="#fdba74" font-size="9" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1.5px">v2.0</text>
    </g>

    <!-- Main Title: IL CAVALIERE -->
    <text x="0" y="-12" fill="url(#textGrad)" font-size="34" class="banner-title" filter="drop-shadow(0 2px 8px rgba(234, 88, 12, 0.18))">
      Il Cavaliere
    </text>

    <!-- Subtitle / Tagline -->
    <text x="0" y="16" fill="#fb923c" font-size="10.5" class="banner-sub" text-transform="uppercase">
      Bot Discord &amp; Dashboard Moderatori
    </text>

    <!-- Minimalist Feature Badges / Highlights -->
    <g transform="translate(0, 42)" fill="#94a3b8" font-size="9" class="banner-tags">
      <text x="0" y="0">
        <tspan fill="#f97316">✦</tspan> Llama 70B AI  
        <tspan fill="#475569" dx="6">•</tspan>
        <tspan fill="#94a3b8" dx="6">Partnerships</tspan>  
        <tspan fill="#475569" dx="6">•</tspan>
        <tspan fill="#94a3b8" dx="6">AutoMod</tspan>
        <tspan fill="#475569" dx="6">•</tspan>
        <tspan fill="#94a3b8" dx="6">Embeds</tspan>
      </text>
    </g>
  </g>
</svg>
