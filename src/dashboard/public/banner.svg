<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <!-- Solid Flat Background (No shadows or glows) -->
  <rect width="600" height="240" fill="#0c0d12" />

  <!-- Right Section: Minimalist Knight Emblem and Typography -->
  <g transform="translate(360, 45)">
    <!-- Minimalist Knight Shield & Helmet Symbol -->
    <g transform="translate(0, 0)">
      <!-- Outer Shield Outline -->
      <path d="M0 -35 C20 -35 40 -28 40 -28 C40 8 30 32 0 48 C-30 32 -40 8 -40 -28 C-40 -28 -20 -35 0 -35 Z" 
            fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round" />

      <!-- Helmet Crown -->
      <path d="M0 -22 C-12 -22 -20 -14 -21 -4 L21 -4 C20 -14 12 -22 0 -22 Z" fill="#f59e0b" />
      <path d="M-4 -30 L0 -37 L4 -30 L0 -25 Z" fill="#f59e0b" />

      <!-- Helmet Faceplate -->
      <path d="M-21 0 L-22 10 C-22 21 -14 29 0 32 C14 29 22 21 22 10 L21 0 Z" fill="#f59e0b" />

      <!-- Visor Eye Slit Cutout -->
      <rect x="-16" y="3" width="32" height="3" rx="1" fill="#0c0d12" />

      <!-- Breathing Slits Cutouts -->
      <rect x="-10" y="10" width="3" height="10" rx="1.5" fill="#0c0d12" />
      <rect x="-2" y="10" width="4" height="13" rx="2" fill="#0c0d12" />
      <rect x="7" y="10" width="3" height="10" rx="1.5" fill="#0c0d12" />
    </g>

    <!-- Main Title -->
    <text x="0" y="85" 
          font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" 
          font-size="28" 
          font-weight="800" 
          letter-spacing="6" 
          fill="#f59e0b" 
          text-anchor="middle">
      IL CAVALIERE
    </text>

    <!-- Clean Divider Line -->
    <line x1="-120" y1="105" x2="120" y2="105" stroke="#f59e0b" stroke-width="1.5" stroke-opacity="0.6" />

    <!-- Subtitle -->
    <text x="0" y="128" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="3" 
          fill="#cbd5e1" 
          text-anchor="middle">
      DISCORD BOT &amp; DASHBOARD
    </text>
  </g>
</svg>
