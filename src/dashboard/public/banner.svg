<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Grenze+Gotisch:wght@800;900&amp;family=Pirata+One&amp;display=swap');
      
      .brand-gotisch {
        font-family: 'Grenze Gotisch', 'Pirata One', serif;
        font-weight: 900;
        letter-spacing: 2px;
      }
    </style>

    <!-- Clean Crisp Silver & Light Slate Gradient -->
    <linearGradient id="silverPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#f8fafc" />
      <stop offset="75%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Polished Gunmetal & Dark Steel Text Gradient -->
    <linearGradient id="steelTextGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="45%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Hero Crusader Blood-Red Gradient for Cross -->
    <linearGradient id="crusaderCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Pure Seamless Knights Templar Cross Path -->
    <g id="templarCrossSingle">
      <path d="M -15 -15 
               C -20 -55 -45 -115 -92 -165 
               C -40 -140 40 -140 92 -165 
               C 45 -115 20 -55 15 -15 
               C 55 -20 115 -45 165 -92 
               C 140 -40 140 40 165 92 
               C 115 45 55 20 15 15 
               C 20 55 45 115 92 165 
               C 40 140 -40 140 -92 165 
               C -45 115 -20 55 -15 15 
               C -55 20 -115 45 -165 92 
               C -140 40 -140 -40 -165 -92 
               C -115 -45 -55 -20 -15 -15 Z" />
    </g>

    <!-- Elongated Knights Templar Cross specifically sculpted for letter "t" -->
    <g id="elongatedTemplarT">
      <path d="M -4.2 -4.2 
               C -5.6 -14 -12 -30 -24 -42 
               C -10 -35 10 -35 24 -42 
               C 12 -30 5.6 -14 4.2 -4.2 
               C 14 -5.6 30 -12 42 -24 
               C 35 -10 35 10 42 24 
               C 30 12 14 5.6 4.2 4.2 
               C 5.6 24 14 52 26 72 
               C 11 60 -11 60 -26 72 
               C -14 52 -5.6 24 -4.2 4.2 
               C -14 5.6 -30 12 -42 24 
               C -35 10 -35 -10 -42 -24 
               C -30 -12 -14 -5.6 -4.2 -4.2 Z" />
    </g>
  </defs>

  <!-- Base Clean Silver Plate Background -->
  <rect width="600" height="240" fill="url(#silverPlateGrad)" />

  <!-- Subtle Clean Hairline Border -->
  <rect width="598" height="238" x="1" y="1" rx="6" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.9" />
  <rect width="596" height="236" x="2" y="2" rx="5" fill="none" stroke="#cbd5e1" stroke-width="1" />

  <!-- Centered Hero Wordmark: Pure Neo-Gothic Sentry with Crimson Templar Cross "t" -->
  <g transform="translate(300, 120)">
    <g transform="translate(-148, 0)">
      <!-- Left part: sen in Dark Steel -->
      <text x="0" y="30" fill="url(#steelTextGrad)" font-size="102" class="brand-gotisch" filter="drop-shadow(0 4px 14px rgba(15, 23, 42, 0.18))">
        sen
      </text>

      <!-- Center: Elongated Templar Cross as "t" in Hero Crimson Gradient -->
      <g transform="translate(178, -4) scale(0.68)" fill="url(#crusaderCrossGrad)" filter="drop-shadow(0 4px 16px rgba(220, 38, 38, 0.45))">
        <use href="#elongatedTemplarT" />
      </g>

      <!-- Right part: ry. in Dark Steel with Crimson Dot -->
      <text x="214" y="30" fill="url(#steelTextGrad)" font-size="102" class="brand-gotisch" filter="drop-shadow(0 4px 14px rgba(15, 23, 42, 0.18))">
        ry<tspan fill="url(#crusaderCrossGrad)">.</tspan>
      </text>
    </g>
  </g>
</svg>
