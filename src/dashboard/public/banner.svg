<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;display=swap');
      .banner-title {
        font-family: 'Montserrat', system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: -0.5px;
      }
      .banner-sub {
        font-family: 'Montserrat', system-ui, sans-serif;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .banner-tags {
        font-family: 'Montserrat', system-ui, sans-serif;
        font-weight: 600;
        letter-spacing: 1px;
      }
    </style>

    <!-- Clean Crisp Silver & Light Slate Gradient -->
    <linearGradient id="silverPlateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#f8fafc" />
      <stop offset="80%" stop-color="#f1f5f9" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Hero Crusader Blood-Red Gradient for Cross -->
    <linearGradient id="crusaderCrossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="100%" stop-color="#991b1b" />
    </linearGradient>

    <!-- Pure Seamless Knights Templar Cross Path -->
    <g id="templarCrossSingle">
      <path d="M -15 -15 
               C -20 -55 -45 -115 -92 -165 
               C -40 -140 40 -140 92 -165 
               C 45 -115 20 -55 15 -15 
               C 55 -20 115 -45 165 -92 
               C 140 -40 140 40 165 92 
               C 115 45 55 20 15 15 
               C 20 55 45 115 92 165 
               C 40 140 -40 140 -92 165 
               C -45 115 -20 55 -15 15 
               C -55 20 -115 45 -165 92 
               C -140 40 -140 -40 -165 -92 
               C -115 -45 -55 -20 -15 -15 Z" />
    </g>
  </defs>

  <!-- Base Clean Silver Plate Background -->
  <rect width="600" height="240" fill="url(#silverPlateGrad)" />

  <!-- Subtle Clean Hairline Border -->
  <rect width="598" height="238" x="1" y="1" rx="6" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.8" />
  <rect width="596" height="236" x="2" y="2" rx="5" fill="none" stroke="#cbd5e1" stroke-width="1" />

  <!-- Left: Crusader Cross Emblem on Silver Armor -->
  <g transform="translate(130, 120)">
    <!-- Heraldic Concentric Rings -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#cbd5e1" stroke-width="1" />
    <circle cx="0" cy="0" r="92" fill="none" stroke="#dc2626" stroke-width="1" stroke-opacity="0.25" stroke-dasharray="4 6" />
    
    <!-- Hero Cross (Authentic Crusader Blood-Red on Silver Armor) -->
    <g transform="scale(0.46)" fill="url(#crusaderCrossGrad)" filter="drop-shadow(0 4px 12px rgba(220, 38, 38, 0.35))">
      <use href="#templarCrossSingle" />
    </g>
  </g>

  <!-- Right: Luxury Typography & Subtitle -->
  <g transform="translate(250, 120)">
    <!-- Version Tag Pill in Polished Steel & Enamel -->
    <g transform="translate(0, -65)">
      <rect x="0" y="0" width="58" height="18" rx="9" fill="rgba(220, 38, 38, 0.08)" stroke="rgba(220, 38, 38, 0.3)" stroke-width="1" />
      <text x="29" y="12.5" fill="#dc2626" font-size="9" font-family="'Montserrat', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1px">v2.0</text>
    </g>

    <!-- Main Title: IL CAVALIERE -->
    <text x="0" y="-12" fill="#0f172a" font-size="34" class="banner-title">
      Il Cavaliere
    </text>

    <!-- Subtitle / Tagline in Crusader Crimson -->
    <text x="0" y="15" fill="#dc2626" font-size="10.5" class="banner-sub" text-transform="uppercase">
      Bot Discord &amp; Dashboard Moderatori
    </text>

    <!-- Feature Badges in Deep Slate Steel -->
    <g transform="translate(0, 42)" fill="#64748b" font-size="9.5" class="banner-tags">
      <text x="0" y="0">
        <tspan fill="#dc2626">✦</tspan> Llama 70B AI  
        <tspan fill="#94a3b8" dx="6">•</tspan>
        <tspan fill="#334155" dx="6">Partnerships</tspan>  
        <tspan fill="#94a3b8" dx="6">•</tspan>
        <tspan fill="#334155" dx="6">Live Embeds</tspan>
        <tspan fill="#94a3b8" dx="6">•</tspan>
        <tspan fill="#334155" dx="6">AutoMod</tspan>
      </text>
    </g>
  </g>
</svg>
