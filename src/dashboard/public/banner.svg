<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 480" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgLinear" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14110e" />
      <stop offset="50%" stop-color="#0a0a0c" />
      <stop offset="100%" stop-color="#040405" />
    </linearGradient>

    <!-- Gold Gradients -->
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde68a" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#78350f" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0.6" />
    </linearGradient>

    <!-- Subtle Background Pattern -->
    <pattern id="medievalGrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 40 M 0 0 L 40 40" fill="none" stroke="#f59e0b" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="480" fill="url(#bgLinear)" />
  <rect width="1200" height="480" fill="url(#medievalGrid)" />

  <!-- Subtle Radial Glow in Center-Right -->
  <radialGradient id="centerGlow" cx="65%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.12" />
    <stop offset="100%" stop-color="#f59e0b" stop-opacity="0" />
  </radialGradient>
  <rect width="1200" height="480" fill="url(#centerGlow)" />

  <!-- Outer Border Frame -->
  <rect width="1176" height="456" x="12" y="12" rx="16" fill="none" stroke="url(#goldBorder)" stroke-width="1.5" />

  <!-- Main Center-Right Content (Offset to avoid bottom-left avatar overlap) -->
  <g transform="translate(340, 110)">
    
    <!-- Shield & Sword Emblem (Top of Content) -->
    <g transform="translate(240, 0)">
      <!-- Minimalist Shield Outline -->
      <path d="M40 0 C60 0 80 8 80 8 C80 45 70 72 40 90 C10 72 0 45 0 8 C0 8 20 0 40 0 Z" 
            fill="#0f0f14" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round" />
      
      <!-- Minimalist Knight Helmet Inside Shield -->
      <path d="M40 18 C30 18 22 26 21 38 L59 38 C58 26 50 18 40 18 Z" fill="#f59e0b" />
      <path d="M22 42 L20 54 C20 66 28 75 40 78 C52 75 60 66 60 54 L58 42 Z" fill="#f59e0b" />
      <rect x="26" y="46" width="28" height="3.5" rx="1" fill="#0f0f14" />
      <rect x="32" y="55" width="2.5" height="10" rx="1" fill="#0f0f14" />
      <rect x="39" y="55" width="2.5" height="12" rx="1" fill="#0f0f14" />
      <rect x="46" y="55" width="2.5" height="10" rx="1" fill="#0f0f14" />
    </g>

    <!-- Main Title -->
    <text x="280" y="155" 
          font-family="'Cinzel', 'Georgia', 'Times New Roman', serif" 
          font-size="52" 
          font-weight="800" 
          letter-spacing="10" 
          fill="url(#goldText)" 
          text-anchor="middle">
      IL CAVALIERE
    </text>

    <!-- Gold Accent Line -->
    <line x1="80" y1="180" x2="480" y2="180" stroke="#f59e0b" stroke-width="2" stroke-opacity="0.5" />
    <circle cx="280" cy="180" r="3.5" fill="#fde68a" />

    <!-- Subtitle -->
    <text x="280" y="215" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-size="14" 
          font-weight="600" 
          letter-spacing="5" 
          fill="#cbd5e1" 
          text-anchor="middle" 
          opacity="0.85">
      DISCORD BOT &amp; DASHBOARD
    </text>

    <!-- Feature Tags -->
    <g transform="translate(280, 248)" text-anchor="middle" font-family="'Inter', sans-serif" font-size="11" font-weight="600" fill="#fde68a">
      <text x="0" y="0" opacity="0.7">
        AI LLAMA 70B • PARTNERSHIP • EMBEDS • AUTOMOD
      </text>
    </g>
  </g>
</svg>
