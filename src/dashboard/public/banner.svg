<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <!-- Minimalist Dark Background -->
  <rect width="1200" height="400" fill="#0c0d12" />
  <rect width="1180" height="380" x="10" y="10" rx="12" fill="none" stroke="#f59e0b" stroke-width="2" opacity="0.3" />

  <!-- Left: Minimalist Monochromatic Knight Symbol -->
  <g fill="#f59e0b" transform="translate(100, 60)">
    <!-- Outer Shield Frame -->
    <path d="M140 10 C200 10 260 25 260 25 C260 140 230 225 140 280 C50 225 20 140 20 25 C20 25 80 10 140 10 Z" 
          fill="none" stroke="#f59e0b" stroke-width="12" stroke-linejoin="round" />

    <!-- Helmet Top -->
    <path d="M140 50 C105 50 80 78 76 118 L204 118 C200 78 175 50 140 50 Z" />
    <path d="M133 30 L140 15 L147 30 L140 42 Z" />

    <!-- Helmet Faceplate -->
    <path d="M78 130 L73 175 C73 210 100 240 140 250 C180 240 207 210 207 175 L202 130 Z" />

    <!-- Eye Slit (Cutout) -->
    <path d="M90 144 L190 144 L190 155 L90 155 Z" fill="#0c0d12" />

    <!-- Breathing Slits (Cutouts) -->
    <rect x="108" y="174" width="9" height="28" rx="4.5" fill="#0c0d12" />
    <rect x="126" y="174" width="9" height="38" rx="4.5" fill="#0c0d12" />
    <rect x="145" y="174" width="9" height="38" rx="4.5" fill="#0c0d12" />
    <rect x="163" y="174" width="9" height="28" rx="4.5" fill="#0c0d12" />
  </g>

  <!-- Right: Minimalist Typography -->
  <g fill="#f59e0b" transform="translate(440, 120)">
    <!-- Main Title -->
    <text x="0" y="70" 
          font-family="'Cinzel', 'Georgia', serif" 
          font-size="68" 
          font-weight="800" 
          letter-spacing="8" 
          fill="#f59e0b">
      IL CAVALIERE
    </text>

    <!-- Clean Divider Line -->
    <line x1="0" y1="105" x2="640" y2="105" stroke="#f59e0b" stroke-width="3" opacity="0.6" />

    <!-- Subtitle -->
    <text x="4" y="145" 
          font-family="'Inter', -apple-system, sans-serif" 
          font-size="20" 
          font-weight="500" 
          letter-spacing="4" 
          fill="#fde68a" opacity="0.85">
      BOT DISCORD &amp; TAVOLA DI COMANDO
    </text>
  </g>
</svg>
