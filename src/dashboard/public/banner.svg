<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <!-- Warm Ambient Atmospheric Glows -->
    <radialGradient id="leftOrangeGlow" cx="15%" cy="20%" r="55%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.4" />
      <stop offset="60%" stop-color="#ea580c" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="rightOrangeGlow" cx="88%" cy="75%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.35" />
      <stop offset="60%" stop-color="#c2410c" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Exact Knights Templar Beauceant Cross -->
    <g id="templarCrossSolo">
      <!-- Top Arm -->
      <path d="M -3.5 -3.5 C -4 -12 -9 -22 -18 -32 C -8 -27 8 -27 18 -32 C 9 -22 4 -12 3.5 -3.5 Z" />
      <!-- Right Arm (Rotated 90) -->
      <path d="M -3.5 -3.5 C -4 -12 -9 -22 -18 -32 C -8 -27 8 -27 18 -32 C 9 -22 4 -12 3.5 -3.5 Z" transform="rotate(90)" />
      <!-- Bottom Arm (Rotated 180) -->
      <path d="M -3.5 -3.5 C -4 -12 -9 -22 -18 -32 C -8 -27 8 -27 18 -32 C 9 -22 4 -12 3.5 -3.5 Z" transform="rotate(180)" />
      <!-- Left Arm (Rotated 270) -->
      <path d="M -3.5 -3.5 C -4 -12 -9 -22 -18 -32 C -8 -27 8 -27 18 -32 C 9 -22 4 -12 3.5 -3.5 Z" transform="rotate(270)" />
      <!-- Central Core Square -->
      <rect x="-3.5" y="-3.5" width="7" height="7" />
    </g>
  </defs>

  <!-- Pure AMOLED Black Background -->
  <rect width="600" height="240" fill="#000000" />

  <!-- Ambient Glow Illumination -->
  <rect width="600" height="240" fill="url(#leftOrangeGlow)" />
  <rect width="600" height="240" fill="url(#rightOrangeGlow)" />

  <!-- Main Lockup (Mathematically Centered, Zero Extra Crosses) -->
  <g transform="translate(145, 120)">
    
    <!-- Primary Brand Icon: Pure White Templar Cross -->
    <g transform="translate(0, 0) scale(1.05)" fill="#ffffff">
      <use href="#templarCrossSolo" />
    </g>

    <!-- Brand Typography: Il Cavaliere -->
    <text x="60" y="16" 
          font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" 
          font-size="48" 
          font-weight="800" 
          letter-spacing="-0.5" 
          fill="#ffffff">
      Il Cavaliere
    </text>
  </g>
</svg>
