<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <!-- Import Montserrat Font directly inside SVG -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&amp;display=swap');
      .banner-title {
        font-family: 'Montserrat', system-ui, sans-serif;
        font-weight: 900;
        letter-spacing: 1px;
      }
      .banner-sub {
        font-family: 'Montserrat', system-ui, sans-serif;
        font-weight: 700;
        letter-spacing: 3px;
      }
      .banner-tags {
        font-family: 'Montserrat', system-ui, sans-serif;
        font-weight: 600;
        letter-spacing: 1.5px;
      }
    </style>

    <!-- Authentic Metallic Silver & Steel Armor Gradient -->
    <linearGradient id="silverPlateGrad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#d1d5db" />
      <stop offset="25%" stop-color="#e2e8f0" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="88%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>

    <!-- Metallic Brushed Silver Sheen -->
    <linearGradient id="silverBrushedSheen" x1="0%" y1="30%" x2="100%" y2="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3" />
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="65%" stop-color="#475569" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.4" />
    </linearGradient>

    <!-- Corner Vignette in Deep Steel & Subtle Crimson -->
    <radialGradient id="silverEdgeVignette" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.2" />
      <stop offset="65%" stop-color="#94a3b8" stop-opacity="0.05" />
      <stop offset="88%" stop-color="#475569" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#1e293b" stop-opacity="0.5" />
    </radialGradient>

    <!-- Hero Crusader Blood-Red Metallic Gradient for Cross -->
    <linearGradient id="crusaderCrossGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#ff7171" />
      <stop offset="16%" stop-color="#ef4444" />
      <stop offset="50%" stop-color="#dc2626" />
      <stop offset="82%" stop-color="#991b1b" />
      <stop offset="100%" stop-color="#601313" />
    </linearGradient>

    <!-- Deep Anthracite & Polished Steel Gradient for Title -->
    <linearGradient id="titleTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="70%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#7f1d1d" />
    </linearGradient>

    <!-- Subtle Armor Tech / Mesh Grid -->
    <pattern id="armorGrid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#0f172a" stroke-width="0.5" stroke-opacity="0.04" />
    </pattern>

    <!-- Pure Seamless Knights Templar Cross Path -->
    <g id="templarCrossSingle">
      <path d="M -15 -15 
               C -20 -55 -45 -115 -92 -165 
               C -40 -140 40 -140 92 -165 
               C 45 -115 20 -55 15 -15 
               C 55 -20 115 -45 165 -92 
               C 140 -40 140 40 165 92 
               C 115 45 55 20 15 15 
               C 20 55 45 115 92 165 
               C 40 140 -40 140 -92 165 
               C -45 115 -20 55 -15 15 
               C -55 20 -115 45 -165 92 
               C -140 40 -140 -40 -165 -92 
               C -115 -45 -55 -20 -15 -15 Z" />
    </g>
  </defs>

  <!-- Base Metallic Silver Plate Background -->
  <rect width="600" height="240" fill="url(#silverPlateGrad)" />

  <!-- Brushed Steel Lighting Overlay -->
  <rect width="600" height="240" fill="url(#silverBrushedSheen)" />

  <!-- Subtle Armor Tech Grid -->
  <rect width="600" height="240" fill="url(#armorGrid)" />

  <!-- Deep Steel Outer Vignette -->
  <rect width="600" height="240" fill="url(#silverEdgeVignette)" />

  <!-- Polished Steel Hairline Border -->
  <rect width="598" height="238" x="1" y="1" rx="4" fill="none" stroke="#ffffff" stroke-width="0.75" stroke-opacity="0.6" />
  <rect width="596" height="236" x="2" y="2" rx="3" fill="none" stroke="#0f172a" stroke-width="0.5" stroke-opacity="0.2" />

  <!-- Left: Glowing Crusader Cross Emblem on Silver Armor -->
  <g transform="translate(130, 120)">
    <!-- Engraved Heraldic Concentric Rings -->
    <circle cx="0" cy="0" r="76" fill="none" stroke="#0f172a" stroke-width="0.75" stroke-opacity="0.15" />
    <circle cx="0" cy="0" r="92" fill="none" stroke="#dc2626" stroke-width="0.75" stroke-opacity="0.3" stroke-dasharray="4 6" />
    
    <!-- Hero Cross (Authentic Crusader Blood-Red on Silver Armor) -->
    <g transform="scale(0.46)" fill="url(#crusaderCrossGrad)" filter="drop-shadow(0 6px 20px rgba(153, 27, 27, 0.48))">
      <use href="#templarCrossSingle" />
    </g>
  </g>

  <!-- Right: Luxury Typography & Subtitle -->
  <g transform="translate(250, 120)">
    <!-- Version Tag Pill in Polished Steel & Enamel -->
    <g transform="translate(0, -65)">
      <rect x="0" y="0" width="62" height="18" rx="9" fill="rgba(220, 38, 38, 0.12)" stroke="rgba(220, 38, 38, 0.45)" stroke-width="0.75" />
      <text x="31" y="12.5" fill="#991b1b" font-size="9" font-family="'Inter', sans-serif" font-weight="700" text-anchor="middle" letter-spacing="1.5px">v2.0</text>
    </g>

    <!-- Main Title: IL CAVALIERE -->
    <text x="0" y="-12" fill="url(#titleTextGrad)" font-size="34" class="banner-title" filter="drop-shadow(0 2px 4px rgba(255, 255, 255, 0.4)) drop-shadow(0 3px 8px rgba(15, 23, 42, 0.2))">
      Il Cavaliere
    </text>

    <!-- Subtitle / Tagline in Crusader Crimson -->
    <text x="0" y="16" fill="#b91c1c" font-size="10.5" class="banner-sub" text-transform="uppercase" filter="drop-shadow(0 1px 2px rgba(255, 255, 255, 0.3))">
      Bot Discord &amp; Dashboard Moderatori
    </text>

    <!-- Feature Badges in Deep Slate Steel -->
    <g transform="translate(0, 42)" fill="#475569" font-size="9" class="banner-tags">
      <text x="0" y="0">
        <tspan fill="#dc2626">✦</tspan> Llama 70B AI  
        <tspan fill="#64748b" dx="6">•</tspan>
        <tspan fill="#334155" dx="6">Partnerships</tspan>  
        <tspan fill="#64748b" dx="6">•</tspan>
        <tspan fill="#334155" dx="6">AutoMod</tspan>
        <tspan fill="#64748b" dx="6">•</tspan>
        <tspan fill="#334155" dx="6">Embeds</tspan>
      </text>
    </g>
  </g>
</svg>
