<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="100%" height="100%">
  <defs>
    <!-- Warm Ambient Atmospheric Central & Side Glows -->
    <radialGradient id="centerOrangeHalo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.35" />
      <stop offset="45%" stop-color="#f97316" stop-opacity="0.15" />
      <stop offset="85%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sideOrangeGlowLeft" cx="10%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="sideOrangeGlowRight" cx="90%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>

    <!-- Exact Knights Templar Beauceant Cross -->
    <g id="templarCrossSolo">
      <!-- Top Arm -->
      <path d="M -3.5 -3.5 C -4 -12 -9 -22 -18 -32 C -8 -27 8 -27 18 -32 C 9 -22 4 -12 3.5 -3.5 Z" />
      <!-- Right Arm (Rotated 90) -->
      <path d="M -3.5 -3.5 C -4 -12 -9 -22 -18 -32 C -8 -27 8 -27 18 -32 C 9 -22 4 -12 3.5 -3.5 Z" transform="rotate(90)" />
      <!-- Bottom Arm (Rotated 180) -->
      <path d="M -3.5 -3.5 C -4 -12 -9 -22 -18 -32 C -8 -27 8 -27 18 -32 C 9 -22 4 -12 3.5 -3.5 Z" transform="rotate(180)" />
      <!-- Left Arm (Rotated 270) -->
      <path d="M -3.5 -3.5 C -4 -12 -9 -22 -18 -32 C -8 -27 8 -27 18 -32 C 9 -22 4 -12 3.5 -3.5 Z" transform="rotate(270)" />
      <!-- Central Core Square -->
      <rect x="-3.5" y="-3.5" width="7" height="7" />
    </g>
  </defs>

  <!-- Pure AMOLED Black Background -->
  <rect width="600" height="240" fill="#000000" />

  <!-- Ambient Glow Halos -->
  <rect width="600" height="240" fill="url(#centerOrangeHalo)" />
  <rect width="600" height="240" fill="url(#sideOrangeGlowLeft)" />
  <rect width="600" height="240" fill="url(#sideOrangeGlowRight)" />

  <!-- Centered, Large Knights Templar Cross Icon in Pure White -->
  <g transform="translate(300, 120) scale(2.6)" fill="#ffffff">
    <use href="#templarCrossSolo" />
  </g>
</svg>
